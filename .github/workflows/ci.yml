name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Prisma's config needs a URL even for `generate`; jobs with a database override it.
  DATABASE_URL: postgresql://xip:xip@localhost:5432/xip

jobs:
  verify:
    name: Format, lint, types, architecture, unit tests, build
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (supply chain); the comment shows the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @xip/service prisma:generate
      # The Schematron SEFs, so the specs that run the official rules are not skipped. Only the
      # SEFs are cached: the downloaded Peppol .sch has no licence and is never stored.
      - name: Cache the compiled Schematron (SEF)
        id: sef-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/service/validation-artefacts/generated/*.sef.json
          key: sef-${{ hashFiles('apps/service/scripts/validation/**', 'apps/service/validation-artefacts/manifest.json', 'pnpm-lock.yaml') }}
      - if: steps.sef-cache.outputs.cache-hit != 'true'
        run: pnpm -F @xip/service build:validation
      - run: pnpm audit --prod --audit-level high
      - run: pnpm verify

  contract:
    name: Port contracts against Postgres and RabbitMQ
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: xip
          POSTGRES_PASSWORD: xip
          POSTGRES_DB: xip
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U xip -d xip" --health-interval 2s --health-timeout 3s --health-retries 30
      rabbitmq:
        image: rabbitmq:4.4.0-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: xip
          RABBITMQ_DEFAULT_PASS: xip
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 3s --health-timeout 5s --health-retries 30
    env:
      AMQP_URL: amqp://xip:xip@localhost:5672
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @xip/service prisma:generate
      - run: pnpm -F @xip/service prisma:migrate
      - run: pnpm -F @xip/service test:contract --passWithNoTests

  e2e:
    name: End-to-end against the full compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @xip/service prisma:generate
      # Builds both images from this commit; --wait returns once every service is healthy or running
      # and the migrate one-shot has completed.
      - run: docker compose --profile full up -d --build --wait --wait-timeout 300
      # The e2e tests kill RabbitMQ and pause Postgres themselves (docker compose), then the demo
      # runs against the same stack as a smoke test of `pnpm demo`.
      - run: pnpm e2e
      - run: pnpm demo
      - name: Dump the stack on failure
        if: failure()
        run: |
          docker compose --profile full ps --all
          docker compose --profile full logs --no-color --timestamps
      - name: Stop the stack
        if: always()
        run: docker compose --profile full down --volumes
