# Local infrastructure. `pnpm infra:up` starts only Postgres and RabbitMQ (profile "infra");
# the API, worker and mock IdP run natively with Node during development.
# The full stack (images from GHCR or a local build) is added by work package G06.

name: xml-invoice-processor

services:
  postgres:
    image: postgres:18.6-alpine
    profiles: [infra, full]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xip}
      POSTGRES_DB: ${POSTGRES_DB:-xip}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine
    profiles: [infra, full]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-xip}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-xip}
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  postgres-data:
