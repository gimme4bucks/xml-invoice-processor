# Profile "infra" (`pnpm infra:up`): only Postgres, RabbitMQ and the object store; the API, worker
# and mock IdP run natively with Node during development (with BLOB_STORE=postgres by default).
#
# Profile "full": the whole stack from images, for demos and the e2e tests:
#   docker compose --profile full up -d --build --wait
# Clients reach it only over HTTPS through the edge (Caddy, ADR 0013): the API on
# https://localhost:3443, the mock IdP on https://localhost:4443 and the support app on
# https://localhost:5443 (ADR 0018). `pnpm tls:ca` exports the edge's root certificate; `pnpm demo`
# and `pnpm e2e` do that themselves.
# Images come from GHCR (TAG=1.2.3, default latest) or are built locally when missing or with
# --build. Settings follow .env.example. The stack is tuned for the demo and the e2e tests:
# short retry delays, a fake VIES that is unavailable for the first two checks of every VAT
# number (so every document shows the retry path) and knows one invalid number, and a rate limit
# that leaves room for polling.

name: xml-invoice-processor

# One image runs the API, the worker and the migrations (see Dockerfile).
x-service: &service
  image: ghcr.io/gimme4bucks/xml-invoice-processor:${TAG:-latest}
  build:
    context: .
    dockerfile: Dockerfile
  profiles: [full]
  read_only: true
  init: true

# ADAPTERS is fixed, not read from .env: API and worker are separate processes, so in-memory
# adapters would give each its own memory and no document would ever be processed.
x-service-env: &service-env
  ADAPTERS: real
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://${POSTGRES_USER:-xip}:${POSTGRES_PASSWORD:-xip}@postgres:5432/${POSTGRES_DB:-xip}
  AMQP_URL: amqp://${RABBITMQ_USER:-xip}:${RABBITMQ_PASSWORD:-xip}@rabbitmq:5672
  RETRY_DELAYS_MS: ${RETRY_DELAYS_MS:-1000,2000,5000}
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-600}
  SCHEMATRON_POOL_SIZE: ${SCHEMATRON_POOL_SIZE:-1}
  SCHEMATRON_TIMEOUT_MS: ${SCHEMATRON_TIMEOUT_MS:-30000}
  VIES_UNAVAILABLE_TIMES_PER_NUMBER: ${VIES_UNAVAILABLE_TIMES_PER_NUMBER:-2}
  VIES_UNAVAILABLE_RATE: ${VIES_UNAVAILABLE_RATE:-0}
  VIES_INVALID_VAT_NUMBERS: ${VIES_INVALID_VAT_NUMBERS:-NL999999999B99}
  # Stuck-document sweeper (ADR 0014), tuned for the demo: every 10 s, stuck after 90 s. A healthy
  # document here stays unchanged for at most ~65 s (5 s retry + 30 s Schematron + 30 s requeue
  # back-off), and the e2e outages are shorter, so the e2e tests never see a requeue. The
  # production defaults are every minute and 15 minutes.
  SWEEPER_INTERVAL_MS: ${SWEEPER_INTERVAL_MS:-10000}
  SWEEPER_STUCK_AFTER_MS: ${SWEEPER_STUCK_AFTER_MS:-90000}
  # The issuer is only compared as a string: clients fetch tokens through the edge, while the API
  # fetches the keys inside the compose network (plain HTTP, never leaves it). Fixed, like the
  # edge's ports: the AUTH_ISSUER in .env is for the IdP running natively during development.
  AUTH_ISSUER: https://localhost:4443
  AUTH_AUDIENCE: ${AUTH_AUDIENCE:-xml-invoice-processor}
  AUTH_JWKS_URL: http://mock-idp:4000/.well-known/jwks.json
  # Documents in the bucket of the s3 service, only their references in Postgres (ADR 0016). Fixed
  # like ADAPTERS: the full stack shows the production layout. The keys are the local server's
  # demo credentials; a deployment leaves them unset and uses an IAM role.
  BLOB_STORE: s3
  S3_ENDPOINT: http://s3:7070
  S3_FORCE_PATH_STYLE: 'true'
  S3_REGION: ${S3_REGION:-eu-central-1}
  S3_BUCKET: ${S3_BUCKET:-xip-documents}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-xip}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-xip-secret}

services:
  postgres:
    image: postgres:18.6-alpine
    profiles: [infra, full]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xip}
      POSTGRES_DB: ${POSTGRES_DB:-xip}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine
    profiles: [infra, full]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-xip}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-xip}
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # The object store for the documents' bytes (ADR 0016): Versity S3 Gateway on a local directory.
  # Its posix backend shows every top-level directory as a bucket, so the bucket setup is a mkdir
  # before the gateway starts. Lifecycle rules are not supported (ADR 0016 does not need them).
  s3:
    image: versity/versitygw:v1.10.0
    profiles: [infra, full]
    entrypoint: ['/bin/sh', '-c', 'mkdir -p "/data/$${S3_BUCKET}" && exec versitygw posix /data']
    environment:
      S3_BUCKET: ${S3_BUCKET:-xip-documents}
      ROOT_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-xip}
      ROOT_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-xip-secret}
      VGW_REGION: ${S3_REGION:-eu-central-1}
      VGW_HEALTH: /health
    ports:
      - '${S3_PORT:-7070}:7070'
    volumes:
      - s3-data:/data
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:7070/health']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # One-shot: applies pending migrations, then exits. api and worker wait for it to succeed.
  migrate:
    <<: *service
    command: [migrate]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-xip}:${POSTGRES_PASSWORD:-xip}@postgres:5432/${POSTGRES_DB:-xip}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    <<: *service
    command: [api]
    environment:
      <<: *service-env
      API_PORT: 3000
      # Only the edge talks to it: believe the client address and scheme the edge forwards.
      TRUST_PROXY: 'true'
      # Five minutes instead of a year: browsers that apply HSTS to localhost (Safari) would
      # otherwise force every http://localhost port to HTTPS for a year after one visit.
      HSTS_MAX_AGE_SECONDS: ${HSTS_MAX_AGE_SECONDS:-300}
      # CORS for the support app's origin, on the read-only /support endpoints only (ADR 0017).
      # Off when empty, the API's default. The app is the `web` service (ADR 0018).
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost:5443}
    # No ports: only reachable through the edge.
    # Not on mock-idp: the API fetches the signing keys on the first request, so it starts
    # (and answers /health) without the IdP, as it must with a real external one.
    depends_on:
      migrate:
        condition: service_completed_successfully
      s3:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/health']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped

  # No HTTP port, so no healthcheck: compose waits for it to be running.
  worker:
    <<: *service
    command: [worker]
    environment: *service-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      s3:
        condition: service_healthy
    restart: unless-stopped

  mock-idp:
    image: ghcr.io/gimme4bucks/xml-invoice-processor-mock-idp:${TAG:-latest}
    build:
      context: .
      dockerfile: apps/mock-idp/Dockerfile
    profiles: [full]
    read_only: true
    init: true
    environment:
      MOCK_IDP_PORT: 4000
      AUTH_ISSUER: https://localhost:4443
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-xml-invoice-processor}
      # Demo-only clients (format: apps/mock-idp/.env.example): the supplier and the customer
      # of the fixture invoices. Override MOCK_IDP_CLIENTS in .env for anything else.
      MOCK_IDP_CLIENTS: ${MOCK_IDP_CLIENTS:-{"supplier-client":{"secret":"change-me","org_id":"org-supplier","peppol_id":"0106:11111111","scopes":["documents:submit","documents:read"]},"customer-client":{"secret":"change-me","org_id":"org-customer","peppol_id":"0106:22222222","scopes":["documents:submit","documents:read"]}}}
      # The support app's public client support-web (Authorization Code + PKCE, ADR 0017): its
      # exact redirect URI (the `web` service's callback, ADR 0018) and a demo support employee.
      MOCK_IDP_SUPPORT_REDIRECT_URIS: ${MOCK_IDP_SUPPORT_REDIRECT_URIS:-https://localhost:5443/callback}
      MOCK_IDP_SUPPORT_USERS: ${MOCK_IDP_SUPPORT_USERS:-{"support-agent":{"password":"change-me"}}}
    # No ports: only reachable through the edge.
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:4000/.well-known/jwks.json']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped

  # The support app (ADR 0018): static files only, served by Caddy as a non-root user (uid 10001)
  # and reached only through the edge at https://localhost:5443. The API URL, the issuer and the
  # client id are runtime configuration: the server writes them into /config.js and into the CSP's
  # connect-src, so one image serves any environment.
  web:
    image: ghcr.io/gimme4bucks/xml-invoice-processor-web:${TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    profiles: [full]
    read_only: true
    init: true
    # Caddy's storage (lock files only: no certificates here, the edge terminates TLS).
    tmpfs:
      - /data:uid=10001,gid=10001,mode=0700
    environment:
      # Fixed like AUTH_ISSUER: the edge's URLs, which the browser uses.
      API_URL: https://localhost:3443
      IDP_ISSUER: https://localhost:4443
      CLIENT_ID: support-web
      # Five minutes, like the API (ADR 0013); the image's default is a year.
      HSTS_MAX_AGE_SECONDS: ${HSTS_MAX_AGE_SECONDS:-300}
    # No ports: only reachable through the edge.
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped

  # The only way in from the host (ADR 0013). Caddy terminates TLS with its own CA, whose root
  # stays in the edge-data volume (`down --volumes` creates a new one), and forwards plain HTTP
  # inside the network. Plain HTTP to its ports gets a 400, never a redirect. The configuration is
  # mounted read-only and the admin API is off (deploy/caddy/Caddyfile).
  edge:
    image: caddy:2.11.7-alpine
    profiles: [full]
    # Not root: the ports are above 1024, and the image's /data/caddy is world-writable, so a new
    # edge-data volume is writable for any user.
    user: '10001:10001'
    read_only: true
    init: true
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - edge-data:/data
    ports:
      - '3443:3443'
      - '4443:4443'
      - '5443:5443'
    depends_on:
      - api
      - mock-idp
      - web
    # A verified HTTPS request on every port with the edge's own root certificate. Any HTTP answer
    # counts (a 502 too): this checks the edge, the services behind it have their own checks.
    healthcheck:
      test:
        - CMD
        - curl
        - --silent
        - --show-error
        - --fail-early
        - --output
        - /dev/null
        - --cacert
        - /data/caddy/pki/authorities/local/root.crt
        - https://localhost:3443/health
        - https://localhost:4443/.well-known/jwks.json
        - https://localhost:5443/
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped

volumes:
  postgres-data:
  s3-data:
  edge-data:
